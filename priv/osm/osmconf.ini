# GDAL OSM driver configuration used by `mix import_osm`.
# Only the tags we need are extracted, everything else is dropped.
[general]
closed_ways_are_polygons=building,boundary,amenity,leisure,landuse,place,natural,tourism

[points]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=addr:street,addr:housenumber,addr:postcode
other_tags=no

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,highway
other_tags=no

[multipolygons]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type,building,boundary,admin_level,postal_code,leisure,garden:type,landuse,construction,natural,water,place,tourism,highway,addr:street,addr:housenumber,addr:postcode
other_tags=no

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
other_tags=no

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
other_tags=no
