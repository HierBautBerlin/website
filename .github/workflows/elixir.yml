on: push

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      ELIXIR_VERSION: "1.20.4"
      OTP_VERSION: "28.3"

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hierbautberlin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Install pdf and geo packages
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf gdal-bin

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pdfminer
        run: pip install pdfminer.six

      - name: Setup elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Retrieve Mix Dependencies Cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-mix-

      - name: Install Mix Dependencies
        run: mix deps.get

      - name: Install npm dependencies
        run: npm ci --prefix assets

      # phoenix, phoenix_html and phoenix_live_view are file: dependencies, so
      # their version in the lock file comes from deps/. Dependabot only bumps
      # mix.lock and the docker build then fails with its older npm.
      - name: Check that assets/package-lock.json matches deps/
        working-directory: assets
        run: |
          npm install --package-lock-only
          if ! git diff --exit-code package-lock.json; then
            echo "::error file=assets/package-lock.json::Out of date, run 'just update' and commit the change"
            exit 1
          fi

      - name: Retrieve PLT Cache
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: ${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-plts-v4-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-plts-v4-

      - name: Create PLTs
        run: mix dialyzer --plt

      - name: Run checks
        run: mix check

      - name: Build assets
        run: MIX_ENV=dev mix assets.build
