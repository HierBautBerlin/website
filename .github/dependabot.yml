version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/assets"
    schedule:
      interval: "weekly"

  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images in the Dockerfile (Debian snapshot dates, Elixir/OTP, node).
  # Each base image bump also invalidates the cached `apt-get upgrade` layer.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      base-images:
        patterns:
          - "*"
